# Readback skeleton. Usage: src/ops/preflight.sh && docker compose up -d --build
services:
  iris:
    build:
      context: .
      args:
        IRIS_IMAGE: ${IRIS_IMAGE:-irishealth-community:2026.3.0AI.154.0}
    image: ${READBACK_IMAGE:-iris-readback:local}
    environment:
      # Name only; the value comes from the shell or an untracked .env file. Empty means replay mode later.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      READBACK_DEMO_PASSWORD: ${READBACK_DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:${READBACK_PORTAL_PORT:-52790}:52773"
      - "127.0.0.1:${READBACK_HL7_PORT:-5001}:5001"
      # The MCP gateway (README: REPRODUCE.md) listens on 8000 inside the container once a person starts it; nothing is served until then.
      # Published on the loopback only: the public proxy does not route it.
      - "127.0.0.1:${READBACK_MCP_PORT:-8765}:8000"
    volumes:
      - readback-inbox:/data/in
    restart: unless-stopped

  # The interface and the reverse proxy: serves the built frontend and forwards only the Readback paths.
  # The host bind is loopback by default; the public demo sets READBACK_UI_BIND.
  ui:
    build:
      context: .
      dockerfile: src/ops/proxy/Dockerfile
    image: ${READBACK_UI_IMAGE:-iris-readback-ui:local}
    environment:
      # Names only; the values come from the shell or an untracked .env file.
      READBACK_DEMO_PASSWORD: ${READBACK_DEMO_PASSWORD:-}
      READBACK_PUBLISH_DEMO_ACCOUNTS: ${READBACK_PUBLISH_DEMO_ACCOUNTS:-0}
    ports:
      - "${READBACK_UI_BIND:-127.0.0.1}:${READBACK_UI_PORT:-8080}:80"
    depends_on:
      iris:
        condition: service_healthy
    restart: on-failure:5

volumes:
  readback-inbox:
